<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina Library</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/additional-methods.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
    <link rel="shortcut icon" href="../assets/images/favicon.png" type="image/x-icon" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="../styles/index.css" />
    <link rel="stylesheet" href="../styles/myLibraryPage.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg px-lg-5">
      <a href="#" class="navbar-brand ms-3 playfair-font fw-bold"> Lumina Library </a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav gap-3 ms-3 me-3 mb-3 mb-lg-0 align-items-lg-center align-items-start">
          <li class="nav-item current-page">
            <a href="#">My Library</a>
          </li>
          <li class="nav-item" id="discoverBooks">
            <a href="#">Dicover Books</a>
          </li>
        </ul>
        <a href="#" id="logoutBtn" class="ms-lg-auto ms-3 me-3">Logout</a>
      </div>
    </nav>

    <section class="container-lg container-fluid mt-5">
      <h2 class="playfair-font fw-bold">My Reading Log</h2>
      <p class="text-muted">Track yout progress and capture your thoughts</p>
      <div class="library-filters mb-4">
        <button class="filter-btn active" data-filter="all">
          <i class="bi bi-grid"></i>
          All
        </button>

        <button class="filter-btn" data-filter="want">
          <i class="bi bi-bookmark"></i>
          Want to Read
        </button>

        <button class="filter-btn" data-filter="reading">
          <i class="bi bi-book-half"></i>
          Reading
        </button>

        <button class="filter-btn" data-filter="completed">
          <i class="bi bi-check-circle"></i>
          Completed
        </button>

        <button class="filter-btn" data-filter="dropped">
          <i class="bi bi-x-circle"></i>
          Dropped
        </button>
      </div>

      <div class="row" id="library-container">
        <span class="spinner-grow m-auto mt-5"></span>
      </div>
    </section>

    <div class="modal fade" id="editBookModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
          <div class="modal-header border-0 pb-0">
            <h4 class="modal-title fw-bold text-dark">
              <i class="bi bi-pencil-square me-2"></i>
              Update Reading
            </h4>

            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body pt-3">
            <form id="editBookForm">
              <input type="hidden" id="bookDocId" />

              <!-- Status -->

              <div class="mb-3">
                <label class="form-label fw-semibold"> Reading Status </label>

                <select class="form-select" id="status">
                  <option value="want">Want to Read</option>
                  <option value="reading">Reading</option>
                  <option value="completed">Completed</option>
                  <option value="dropped">Dropped</option>
                </select>
              </div>

              <!-- Pages -->

              <div class="row">
                <div class="col-6">
                  <div class="mb-3">
                    <label class="form-label fw-semibold"> Pages Read </label>

                    <input type="number" class="form-control" id="pagesRead" min="0" />
                  </div>
                </div>

                <div class="col-6">
                  <div class="mb-3">
                    <label class="form-label fw-semibold"> Total Pages </label>

                    <input type="number" class="form-control" id="totalPages" min="1" />
                  </div>
                </div>
              </div>

              <!-- Dates -->

              <div class="mb-3">
                <label class="form-label fw-semibold"> Started Reading </label>

                <input type="date" class="form-control" id="startedDate" />
              </div>

              <div class="mb-4">
                <label class="form-label fw-semibold"> Completed Date </label>

                <input type="date" class="form-control" id="completedDate" />
              </div>

              <!-- Buttons -->

              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-save flex-grow-1">
                  <i class="bi bi-check-circle me-2"></i>
                  Save Changes
                </button>

                <button type="button" id="deleteBookBtn" class="btn btn-delete">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="../scripts/myLibraryPage.js"></script>
  </body>
</html>
