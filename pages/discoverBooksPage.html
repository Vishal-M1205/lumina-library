<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina Library</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/additional-methods.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
    <link rel="shortcut icon" href="../assets/images/favicon.png" type="image/x-icon" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="../styles/index.css" />
    <link rel="stylesheet" href="../styles/discoverBooksPage.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg px-lg-5">
      <a href="#" class="navbar-brand ms-3 playfair-font fw-bold"> Lumina Library </a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav gap-3 ms-3 me-3 mb-3 mb-lg-0 align-items-lg-center align-items-start">
          <li class="nav-item" id="myLibrary">
            <a href="#">My Library</a>
          </li>
          <li class="nav-item current-page">
            <a href="#">Dicover Books</a>
          </li>
        </ul>
        <a href="#" id="logoutBtn" class="ms-lg-auto ms-3 me-3">Logout</a>
      </div>
    </nav>

    <!--Search Bar & Title-->
    <h1 class="playfair-font text-center mt-5">Discover your next read</h1>
    <div class="d-flex align-items-center justify-content-center">
      <input
        type="text"
        class="form-control search-bar mt-4 rounded-pill px-3 py-3"
        placeholder="Search by title,author or keyword.."
      />
    </div>

    <!--Search Suggestion-->
    <div class="text-center mt-2 mb-5 mx-3 lh-lg search-suggest">
      <small class="border border-1 rounded-pill px-2 py-1 text-nowrap"
        ><a href="#">Matt Haig</a></small
      >
      <small class="border border-1 rounded-pill px-2 py-1 text-nowrap"
        ><a href="#">Robin Sharma</a></small
      >
      <small class="border border-1 rounded-pill px-2 py-1 text-nowrap"
        ><a href="#">Jay Shetty</a></small
      >
      <small class="border border-1 rounded-pill px-2 py-1 text-nowrap"
        ><a href="#">Albert Camus</a></small
      >
      <small class="border border-1 rounded-pill px-2 py-1 text-nowrap"
        ><a href="#">Franz Kafka</a></small
      >
    </div>

    <section class="book-search-section container-md container-fluid">
      <div class="d-flex align-items-center justify-content-between">
        <h4 class="playfair-font">Curated Results</h4>
        <small class="text-muted d-sm-block d-none">Showing top matches</small>
      </div>
      <div class="row mt-4" id="results-container">
        <img src="../assets/images/image.png" class="book-search-image" alt="" />
        <p class="text-center text-muted">
          <i class="bi bi-search"></i> Seek a Book, Find a Journey.
        </p>
      </div>
    </section>

    <!-- Add this directly below your #results-container -->
    <div
      id="pagination-controls"
      class="d-none d-flex justify-content-center align-items-center mt-4 mb-5"
    >
      <button id="prevBtn" class="btn btn-outline-primary me-3">
        <i class="bi bi-chevron-left"></i> Previous
      </button>
      <span id="pageIndicator" class="fw-bold mx-3">Page 1</span>
      <button id="nextBtn" class="btn btn-outline-primary ms-3">
        Next <i class="bi bi-chevron-right"></i>
      </button>
    </div>

    <script src="../scripts/discoverBooksPage.js" type="module"></script>

    <script></script>
  </body>
</html>
