<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover books, organize your personal library, track your reading progress, and turn every page into a new adventure with Lumina Library."
    />

    <meta
      name="keywords"
      content="books, book tracker, reading tracker, online library, book collection, Google Books API, reading progress"
    />

    <meta name="author" content="Lumina Library" />
    <meta name="theme-color" content="#5d737e" />

    <!-- Favicon -->
    <link rel="icon" href="/assets/images/favicon.png" type="image/png" />
    <link rel="shortcut icon" href="/assets/images/favicon.png" type="image/png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="Lumina Library" />

    <meta
      property="og:description"
      content="Discover books, build your personal library, and track every chapter of your reading journey."
    />

    <meta property="og:url" content="https://luminalibrary2026.netlify.app/" />

    <meta property="og:site_name" content="Lumina Library" />

    <meta
      property="og:image"
      content="https://luminalibrary2026.netlify.app/assets/images/favicon.png"
    />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="Lumina Library" />

    <meta
      name="twitter:description"
      content="Discover books, build your personal library, and track every chapter of your reading journey."
    />

    <meta
      name="twitter:image"
      content="https://luminalibrary2026.netlify.app/assets/images/favicon.png"
    />
    <title>Lumina Library</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/additional-methods.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
    <link rel="shortcut icon" href="../assets/images/favicon.png" type="image/x-icon" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="../styles/index.css" />
    <link rel="stylesheet" href="../styles/discoverBooksPage.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg px-lg-5">
      <a href="#" class="navbar-brand ms-3 playfair-font fw-bold"> Lumina Library </a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav gap-3 ms-3 me-3 mb-3 mb-lg-0 align-items-lg-center align-items-start">
          <li class="nav-item" id="myLibrary">
            <a href="#">My Library</a>
          </li>
          <li class="nav-item current-page">
            <a href="#">Dicover Books</a>
          </li>
        </ul>
        <a href="#" id="logoutBtn" class="ms-lg-auto ms-3 me-3">Logout</a>
      </div>
    </nav>

    <!--Search Bar & Title-->
    <h1 class="playfair-font text-center mt-5">Discover your next read</h1>
    <div class="d-flex align-items-center justify-content-center">
      <input
        type="text"
        class="form-control search-bar mt-4 rounded-pill px-3 py-3"
        placeholder="Search by title,author or keyword.."
      />
    </div>

    <!--Search Suggestion-->
    <div class="text-center mt-2 mb-5 mx-3 lh-lg search-suggest">
      <small class="border border-1 rounded-pill px-2 py-1 text-nowrap"
        ><a href="#">Matt Haig</a></small
      >
      <small class="border border-1 rounded-pill px-2 py-1 text-nowrap"
        ><a href="#">Robin Sharma</a></small
      >
      <small class="border border-1 rounded-pill px-2 py-1 text-nowrap"
        ><a href="#">Jay Shetty</a></small
      >
      <small class="border border-1 rounded-pill px-2 py-1 text-nowrap"
        ><a href="#">Albert Camus</a></small
      >
      <small class="border border-1 rounded-pill px-2 py-1 text-nowrap"
        ><a href="#">Franz Kafka</a></small
      >
    </div>

    <section class="book-search-section container-md container-fluid">
      <div class="d-flex align-items-center justify-content-between">
        <h4 class="playfair-font">Curated Results</h4>
        <small class="text-muted d-sm-block d-none">Showing top matches</small>
      </div>
      <div class="row mt-4" id="results-container">
        <img src="../assets/images/image.png" class="book-search-image" alt="" />
        <p class="text-center text-muted">
          <i class="bi bi-search"></i> Seek a Book, Find a Journey.
        </p>
      </div>
    </section>

    <!-- Add this directly below your #results-container -->
    <div
      id="pagination-controls"
      class="d-none d-flex justify-content-center align-items-center mt-4 mb-5"
    >
      <button id="prevBtn" class="btn btn-outline-primary me-3">
        <i class="bi bi-chevron-left"></i> Previous
      </button>
      <span id="pageIndicator" class="fw-bold mx-3">Page 1</span>
      <button id="nextBtn" class="btn btn-outline-primary ms-3">
        Next <i class="bi bi-chevron-right"></i>
      </button>
    </div>

    <!-- Floating Add Button -->
    <button class="floating-add-btn" data-bs-toggle="modal" data-bs-target="#manualAddModal" title="Add Book Manually">
      <i class="bi bi-plus"></i>
    </button>

    <!-- Manual Add Book Modal -->
    <div class="modal fade" id="manualAddModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
          <div class="modal-header border-0 pb-0">
            <h4 class="modal-title fw-bold text-dark">
              <i class="bi bi-journal-plus me-2"></i>
              Add Book Manually
            </h4>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          
          <div class="modal-body pt-3">
            <form id="manualAddForm">
              <div class="mb-3">
                <label class="form-label fw-semibold">Book Title <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="manualTitle" required />
              </div>
              
              <div class="mb-3">
                <label class="form-label fw-semibold">Author <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="manualAuthor" required />
              </div>
              
              <div class="mb-3">
                <label class="form-label fw-semibold">Cover Image URL (Optional)</label>
                <input type="url" class="form-control" id="manualCover" placeholder="https://..." />
              </div>
              
              <div class="row">
                <div class="col-6 mb-3">
                  <label class="form-label fw-semibold">Total Pages</label>
                  <input type="number" class="form-control" id="manualPages" min="1" />
                </div>
                <div class="col-6 mb-3">
                  <label class="form-label fw-semibold">Publish Year</label>
                  <input type="text" class="form-control" id="manualYear" placeholder="e.g. 2024" />
                </div>
              </div>
              
              <div class="mb-4">
                <label class="form-label fw-semibold">Description</label>
                <textarea class="form-control" id="manualDesc" rows="3"></textarea>
              </div>
              
              <button type="submit" class="btn btn-login w-100 py-2 rounded-pill">
                <i class="bi bi-bookmark-plus me-2"></i>Add to Library
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="../scripts/discoverBooksPage.js" type="module"></script>
    <script type="module" src="../scripts/manualAddBook.js"></script>

    <script></script>
  </body>
</html>
